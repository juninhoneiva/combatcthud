name: Release

# Publica o módulo como release no GitHub. A versão vem do module.json
# (tag v<versão>) e as notas vêm da seção "## v<versão>" do CHANGELOG.md.
#
# Quando roda:
#   - push na main que altere o module.json (nova versão entrou): automático;
#   - "Run workflow" na aba Actions (publicação manual);
#   - Release criado pela interface do GitHub (só anexa os arquivos).
# Se o release da versão já existe, nada é feito (exceto quando o próprio
# evento é a criação do release pela interface: aí só anexa os arquivos).
#
# URL de manifesto para instalar no Foundry:
#   https://github.com/juninhoneiva/combatcthud/releases/latest/download/module.json

on:
  push:
    branches: [main]
    paths: [module.json]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir versão e tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(jq -r .version module.json)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          SKIP=false
          if [ "$GITHUB_EVENT_NAME" != "release" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG já existe; nada a fazer."
            SKIP=true
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG (skip=$SKIP)"

      - name: Atualizar module.json
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          jq --arg v "$VERSION" \
             --arg m "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/module.json" \
             --arg d "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/module.zip" \
             '.version = $v | .manifest = $m | .download = $d' module.json > module.tmp.json
          mv module.tmp.json module.json
          cat module.json

      - name: Notas do CHANGELOG
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v tag="## $TAG" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Versão $TAG." > release-notes.md
          fi
          cat release-notes.md

      - name: Empacotar
        if: steps.version.outputs.skip != 'true'
        run: zip -r module.zip module.json README.md CHANGELOG.md LICENSE scripts styles templates lang fonts

      - name: Publicar release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ github.event_name != 'release' && steps.version.outputs.tag || '' }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          # Release criado pela interface mantém o texto escrito lá.
          body_path: ${{ github.event_name != 'release' && 'release-notes.md' || '' }}
          files: |
            module.json
            module.zip
